<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self'; img-src 'self' data:">
<title>Alta Pulse</title>
<link rel="stylesheet" href="ui.css">
</head>
<body>

<!-- tela de login -->
<section id="login" class="screen hidden">
  <img class="logo" src="brand/alta-pulse-white-h.png" alt="Alta Pulse" width="230">
  <p class="muted lead">Entre com o mesmo acesso do painel Alta Pulse.</p>
  <form id="login-form" autocomplete="off">
    <label>E-mail <input id="login-email" type="email" required></label>
    <label>Senha <input id="login-password" type="password" required></label>
    <button type="submit" class="primary" id="login-btn">Entrar</button>
    <p id="login-error" class="error"></p>
  </form>
  <details class="config">
    <summary>Painel</summary>
    <label>Endereço <input id="origin" type="url" placeholder="https://altapulse.com.br"></label>
    <button type="button" id="origin-save" class="ghost">Salvar</button>
  </details>
</section>

<!-- lateral principal -->
<section id="main" class="screen hidden">
  <header>
    <img class="logo small" src="brand/alta-pulse-white-h.png" alt="Alta Pulse" width="170">
    <div class="tools">
      <span id="unread-total" class="bubble-total hidden"></span>
      <button id="btn-search" class="icon hidden" title="Buscar / ordenar criadoras">&#128269;</button>
      <button id="btn-filter" class="icon hidden" title="Somente em atendimento">&#9673;</button>
      <button id="btn-opps" class="icon hidden" title="Oportunidades de venda">&#128176;<i class="dot hidden"></i></button>
      <button id="btn-focus-off" class="focus-off hidden" title="Sair do modo foco (Ctrl+Shift+M)">foco ✕</button>
      <button id="zoom-pill" class="zoom-pill hidden" title="Zoom da página. Clique para voltar ao normal"></button>
      <button id="btn-refresh" class="icon" title="Recarregar a página aberta e a lista">&#8635;</button>
      <button id="btn-menu" class="icon" title="Opções">&#8942;</button>
    </div>
  </header>

  <div class="search" id="blk-search">
    <input id="search" type="search" placeholder="Buscar criadora">
    <select id="sort" title="Ordenar">
      <option value="mine">Minha ordem</option>
      <option value="az">A–Z</option>
      <option value="za">Z–A</option>
      <option value="tag">Por etiqueta</option>
      <option value="recent">Mais recente</option>
      <option value="old">Mais antiga</option>
    </select>
    <button class="blk-min" data-blk="search" title="Minimizar (fica uma lupa no topo)">&#9662;</button>
  </div>
  <div id="my-shift" class="myshift hidden"></div>
  <label class="toggle" id="blk-filter"><input id="only-open" type="checkbox"> <span>Somente em atendimento</span><button class="blk-min" data-blk="filter" title="Minimizar (vira um chip na linha do turno)">&#9662;</button></label>
  <p id="warning" class="warn hidden"></p>
  <button id="my-opps" class="work opps hidden" title="Oportunidades de venda achadas nas conversas"></button>
  <button id="my-list" class="work hidden" title="Fãs que o gestor mandou para você"></button>

  <div id="list" class="list"></div>

  <footer>
    <button id="btn-new-group" class="ghost wide">+ Novo grupo</button>
    <div class="me">
      <div class="who"><div class="uavatar" id="me-avatar" title="Clique para colocar ou trocar sua foto"></div><input type="file" id="me-photo" accept="image/jpeg,image/png,image/webp" hidden><div><b id="me-name"></b><br><span id="me-role" class="muted"></span></div></div>
      <button id="btn-logout" class="ghost">Sair</button>
    </div>
  </footer>
</section>

<!-- menu de opções do app -->
<div id="app-menu" class="popover hidden">
  <div id="zoom-row" class="zoom-row"><span class="zr-label">Zoom</span><button class="zr-btn" data-zoom="out" title="Diminuir (Ctrl −)">−</button><b id="zoom-pct">100%</b><button class="zr-btn" data-zoom="in" title="Aumentar (Ctrl +)">+</button><button class="zr-btn" data-zoom="full" title="Tela cheia (F11)">⤢</button></div>
  <hr>
  <button data-act="panel">Abrir painel no navegador</button>
  <button data-act="tags">Editar etiquetas</button>
  <button data-act="hide">Ocultar perfil aberto</button>
  <hr>
  <button data-act="turn-start" id="menu-turn-start" class="hidden">Iniciar turno em todas</button>
  <button data-act="turn-end" id="menu-turn-end" class="hidden">Encerrar meu turno</button>
  <button data-act="panel-cfg">Painel lateral…</button>
  <button data-act="focus">Modo foco <small class="kbd">Ctrl+Shift+M</small></button>
  <button data-act="about">Sobre</button>
</div>

<!-- menu de cada criadora -->
<div id="creator-menu" class="popover hidden"></div>

<!-- diálogo genérico -->
<div id="dialog" class="modal hidden">
  <div class="box">
    <button id="dialog-x" class="dialog-x" title="Fechar (Esc)" aria-label="Fechar">×</button>
    <h3 id="dialog-title"></h3>
    <div id="dialog-body"></div>
    <div class="actions">
      <button id="dialog-cancel" class="ghost">Cancelar</button>
      <button id="dialog-ok" class="primary">OK</button>
    </div>
  </div>
</div>

<div id="toast" class="toast hidden"></div>

<script src="motivation.js"></script>
<script src="ui.js"></script>
</body>
</html>
